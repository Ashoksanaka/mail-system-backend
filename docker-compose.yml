# ──────────────────────────────────────────────────────────────
# Docker Compose — Bulk Email Dispatch Platform (Backend)
# Services: db, redis, backend, celery, celery-beat, caddy
# ──────────────────────────────────────────────────────────────

services:
  # ── 1. PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Published for host-network Celery (DB_HOST=127.0.0.1)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mail_system_net

  # ── 2. Redis (Celery Broker + Channel Layer) ───────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Published for host-network Celery (REDIS_URL=redis://127.0.0.1:6379/0)
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - mail_system_net

  # ── 3. Django Backend (Daphne ASGI Server) ─────────────────
  backend:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: /app/entrypoint.sh
    networks:
      - mail_system_net

  # ── 4. Caddy (Reverse Proxy & Auto-HTTPS) ──────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-13-60-91-88.nip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mail_system_net
    depends_on:
      - backend

  # ── 5. Celery Worker ───────────────────────────────────────
  # Host networking so outbound Gmail SMTP uses the host stack
  # (bridge NAT often blocks/breaks SMTP). Talks to db/redis via
  # published localhost ports below.
  celery:
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
      - redis
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - .:/app
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 6. Celery Beat (periodic tasks) ────────────────────────
  celery-beat:
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
      - redis
      - celery
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
    volumes:
      - .:/app
    command: celery -A celery_app beat --loglevel=info

# ── Named Volumes ────────────────────────────────────────────
volumes:
  postgres_data:
  caddy_data:
  caddy_config:

# ── Networks ─────────────────────────────────────────────────
networks:
  mail_system_net:
    name: mail_system_net
    external: true
